services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - cred8_mongo_data:/data/db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8086:8086'
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017/cred8
    depends_on:
      - mongo

volumes:
  cred8_mongo_data:
